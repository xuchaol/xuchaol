<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <h1>贪吃蛇</h1>
      <section class="hud" aria-label="游戏信息">
        <p>得分：<span id="score">0</span></p>
        <p>最高分：<span id="high-score">0</span></p>
        <button id="restart" type="button">重新开始</button>
      </section>
      <canvas id="game" width="400" height="400" aria-label="贪吃蛇游戏画布"></canvas>
      <p class="hint">方向键/WASD 控制移动。吃到食物会变长并加分。</p>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
